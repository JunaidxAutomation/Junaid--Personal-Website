<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="100%" stop-color="#9fe8f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#030c1c"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- grid dots -->
  <g opacity="0.08">
    <circle cx="100" cy="100" r="2" fill="#00b4d8"/>
    <circle cx="200" cy="100" r="2" fill="#00b4d8"/>
    <circle cx="300" cy="100" r="2" fill="#00b4d8"/>
    <circle cx="1100" cy="530" r="2" fill="#00b4d8"/>
    <circle cx="1000" cy="530" r="2" fill="#00b4d8"/>
  </g>

  <!-- monogram badge -->
  <rect x="80" y="80" width="88" height="88" rx="20" fill="#00b4d8"/>
  <text x="124" y="142" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#00131c" text-anchor="middle">J</text>

  <!-- eyebrow -->
  <text x="80" y="230" font-family="'Courier New', monospace" font-size="20" letter-spacing="3" fill="#00b4d8">AI AUTOMATION ENGINEER · LEGAL TECH SPECIALIST</text>

  <!-- headline -->
  <text x="78" y="310" font-family="Georgia, serif" font-size="64" font-weight="700" fill="url(#textGrad)">Junaid Hassan</text>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#c5d5e3">I build AI systems that actually ship.</text>

  <!-- supporting line -->
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="22" fill="#8fa3b8">Production-grade AI automation, Legal Tech SaaS &amp; B2B systems</text>
  <text x="80" y="462" font-family="Arial, sans-serif" font-size="22" fill="#8fa3b8">built solo, shipped to production.</text>

  <!-- bottom bar -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#1a3448" stroke-width="1"/>
  <text x="80" y="575" font-family="'Courier New', monospace" font-size="20" fill="#00b4d8">junaid-hassan.vercel.app</text>
  <text x="1120" y="575" font-family="'Courier New', monospace" font-size="20" fill="#8fa3b8" text-anchor="end">Wazirabad, Pakistan — Available Globally</text>
</svg>
