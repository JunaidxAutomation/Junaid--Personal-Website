<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23030c1c%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22Arial,sans-serif%22 font-weight=%22bold%22 fill=%22%2300b4d8%22 text-anchor=%22middle%22%3EJ%3C/text%3E%3C/svg%3E">
<title>Page Not Found — Junaid Hassan</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#030c1c">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030c1c;
    --teal:#00b4d8;
    --ink:#f4f8fb;
    --muted:#8fa3b8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
    padding-top:calc(6vh + env(safe-area-inset-top,0px));
    padding-bottom:calc(6vh + env(safe-area-inset-bottom,0px));
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .glow{
    position:absolute;
    top:50%; left:50%;
    width:60vmax; height:60vmax;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(0,180,216,0.12) 0%, transparent 65%);
    pointer-events:none;
  }
  .wrap{ position:relative; max-width:560px; }
  .code{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(4.5rem, 14vw, 8rem);
    line-height:1;
    letter-spacing:-0.02em;
    color:var(--teal);
    margin-bottom:0.5rem;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.4rem, 4vw, 1.9rem);
    margin-bottom:0.9rem;
  }
  p{
    color:var(--muted);
    font-size:1rem;
    line-height:1.6;
    margin-bottom:2.2rem;
  }
  .actions{
    display:flex;
    gap:0.75rem;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:2.5rem;
  }
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:0.95rem;
    text-decoration:none;
    padding:0.75rem 1.5rem;
    border-radius:999px;
    transition:transform 0.2s ease, opacity 0.2s ease;
  }
  .btn-primary{
    background:var(--teal);
    color:#00131c;
  }
  .btn-secondary{
    border:1px solid rgba(143,163,184,0.35);
    color:var(--ink);
  }
  .btn:hover{ transform:translateY(-2px); opacity:0.92; }
  @media (prefers-reduced-motion: reduce){
    .btn:hover{ transform:none; }
  }
  nav{
    display:flex;
    gap:1.25rem;
    justify-content:center;
    flex-wrap:wrap;
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  nav a{
    color:var(--muted);
    text-decoration:none;
  }
  nav a:hover{ color:var(--teal); }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The page you're looking for may have moved, or the link might be outdated. Here's how to find what you need.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/contact.html" class="btn btn-secondary">Contact Me</a>
    </div>
    <nav aria-label="Quick links">
      <a href="/about.html">About</a>
      <a href="/services.html">Services</a>
      <a href="/work.html">Work</a>
      <a href="/pricing.html">Pricing</a>
    </nav>
  </div>
</body>
</html>
